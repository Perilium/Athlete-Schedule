<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <meta name="description" content="Hybrid 5.2 mobile workout coach with timers, rep tracking, and progression history.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <title>Hybrid 5.2 Workout Coach</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Hybrid 5.2</p>
          <h1>Workout Coach</h1>
        </div>
        <button id="installBtn" class="ghost-btn hidden" type="button">Install</button>
      </header>

      <nav class="tabs" aria-label="App sections">
        <button class="tab active" data-screen="today" type="button">Today</button>
        <button class="tab" data-screen="history" type="button">History</button>
        <button class="tab" data-screen="settings" type="button">Settings</button>
      </nav>

      <main>
        <section id="todayScreen" class="screen active-screen">
          <div id="dayGrid" class="day-grid"></div>
          <div id="recoveryInfo" class="recovery-strip"></div>
          <div id="sessionPanel" class="session-panel hidden"></div>
        </section>

        <section id="historyScreen" class="screen">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Saved locally</p>
              <h2>Workout History</h2>
            </div>
            <button id="clearHistoryBtn" class="danger-link" type="button">Clear</button>
          </div>
          <div id="historyList" class="stack"></div>
        </section>

        <section id="settingsScreen" class="screen">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Fine tune</p>
              <h2>Settings</h2>
            </div>
          </div>
          <div class="settings-list">
            <label class="setting-row">
              <span>Easy recovery seconds</span>
              <input id="easyRecoveryInput" type="number" min="60" max="90" step="5">
            </label>
            <label class="setting-row">
              <span>Enable vibration</span>
              <input id="vibrationInput" type="checkbox">
            </label>
            <label class="setting-row">
              <span>Keep screen awake during workouts</span>
              <input id="wakeLockInput" type="checkbox">
            </label>
          </div>
          <p class="soft-note">History and settings stay on this phone using localStorage. No account or internet is needed once installed.</p>
        </section>
      </main>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
