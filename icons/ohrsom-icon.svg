<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f2e"/>
      <stop offset="50%" stop-color="#09131d"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="230" r="130" fill="url(#goldGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Botanical / Palm Leaf Graphic for Sukkot & Yom Tov -->
  <g transform="translate(256, 215) scale(1.15)">
    <!-- Central Stem -->
    <path d="M0,110 Q5,20 0,-110" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Top Crown Leaf -->
    <path d="M0,-110 C-22,-80 -18,-40 0,-20 C18,-40 22,-80 0,-110 Z" fill="url(#goldGrad)"/>

    <!-- Left Leaves -->
    <path d="M-4,-70 C-55,-65 -85,-35 -80,5 C-45,-5 -20,-35 -2,-50 Z" fill="url(#tealGrad)"/>
    <path d="M-5,-20 C-65,-10 -95,25 -85,65 C-50,50 -25,15 -2,0 Z" fill="url(#goldGrad)"/>
    <path d="M-5,35 C-60,48 -80,85 -65,115 C-38,100 -20,65 -2,50 Z" fill="url(#tealGrad)"/>

    <!-- Right Leaves -->
    <path d="M4,-70 C55,-65 85,-35 80,5 C45,-5 20,-35 2,-50 Z" fill="url(#goldGrad)"/>
    <path d="M5,-20 C65,-10 95,25 85,65 C50,50 25,15 2,0 Z" fill="url(#tealGrad)"/>
    <path d="M5,35 C60,48 80,85 65,115 C38,100 20,65 2,50 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Title Pill at Bottom -->
  <rect x="80" y="380" width="352" height="64" rx="32" fill="rgba(245, 158, 11, 0.15)" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="422" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="4">OHRSOM</text>
</svg>
